<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>💘 Valentine Quest</title>

<style>
:root{
  --bg1:#ffe0ec;
  --bg2:#ffd1e1;
  --card:#ffffffcc;
  --txt:#3a0b1e;
  --accent:#ff2d6d;
  --accent2:#ff5aa0;
  --shadow: 0 18px 60px rgba(0,0,0,.12);
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:var(--txt);
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(1200px 700px at 20% 10%, var(--bg2), transparent 60%),
    radial-gradient(900px 600px at 90% 30%, #ffc0d6, transparent 55%),
    linear-gradient(180deg, var(--bg1), #fff);
  overflow-x:hidden;
}

/* Floating hearts */
.heart-field{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.heart{
  position:absolute;
  width:18px; height:18px;
  opacity:.55;
  transform: rotate(45deg);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 4px;
  animation: floatUp linear forwards;
}
.heart::before,.heart::after{
  content:"";
  position:absolute;
  width:18px; height:18px;
  background: inherit;
  border-radius:50%;
}
.heart::before{ left:-9px; top:0; }
.heart::after{ top:-9px; left:0; }

@keyframes floatUp{
  from{ transform: translateY(30vh) rotate(45deg); }
  to{ transform: translateY(-140vh) rotate(45deg); }
}

.wrap{
  width:min(920px, 92vw);
  display:grid;
  grid-template-columns: 1.2fr .8fr;
  gap:18px;
  z-index:1;
  padding:22px;
}
@media (max-width: 860px){
  .wrap{ grid-template-columns:1fr; }
}

.card{
  background:var(--card);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,45,109,.18);
  border-radius:22px;
  box-shadow: var(--shadow);
  padding:20px;
}

.title{
  font-size: clamp(22px, 3.1vw, 34px);
  margin-bottom:10px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  padding:10px 14px;
  border-radius:999px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color:white;
  font-weight:600;
  cursor:pointer;
}

.badge{
  padding:8px 12px;
  border-radius:999px;
  border:1px dashed rgba(255,45,109,.35);
  background: rgba(255,255,255,.55);
  font-weight:600;
  margin-top:10px;
}

.final{
  margin-top:12px;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,45,109,.18);
  background: linear-gradient(180deg, #fff, #fff0f6);
  display:none;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#fff;
  border-radius:999px;
  padding:10px 14px;
  box-shadow:0 14px 40px rgba(0,0,0,.14);
  display:none;
  z-index:2;
}
</style>
</head>

<body>

<div class="heart-field" id="heartField"></div>

<div class="wrap">
  <section class="card">
    <h1 class="title">💘 Valentine Quest</h1>
    <p>Press buttons, make choices, collect hearts, and unlock the secret message.</p>

    <div id="stageText"></div>
    <div class="buttons" id="choices"></div>

    <div class="final" id="finalBox">
      <p id="finalText"></p>
    </div>
  </section>

  <aside class="card">
    <h3>❤️ Progress</h3>
    <div class="badge">Hearts collected: <span id="score">0</span> / 6</div>

    <hr style="margin:20px 0;opacity:.2;">

    <h3>🎵 Background Vibes</h3>
    <p>Press play for extra romantic chaos energy.</p>

    <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;">
      <iframe 
        src="https://www.youtube.com/embed/UZWmtxLiiFE?si=fnF18UXyx6HzpzKk"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;">
      </iframe>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const state = { hearts:0 };
const scoreEl = document.getElementById("score");
const stageText = document.getElementById("stageText");
const choices = document.getElementById("choices");
const finalBox = document.getElementById("finalBox");
const finalText = document.getElementById("finalText");
const toast = document.getElementById("toast");

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(()=> toast.style.display="none",2000);
}

function addHeart(reason){
  if(state.hearts < 6){
    state.hearts++;
    scoreEl.textContent = state.hearts;
    showToast("💗 +" + 1 + " heart — " + reason);
  }
  if(state.hearts === 6){
    finalBox.style.display="block";
    finalText.innerHTML = "Te quiero mucho 💘<br>You are the best thing that ever happened to me!";
  }
}

function render(){
  stageText.innerHTML = "<p>A magical heart door appears. Choose wisely:</p>";
  choices.innerHTML = "";

  const options = [
    {label:"Press the ♥ button", reason:"bold romance"},
    {label:"Press the ✨ sparkle button", reason:"excellent taste"},
    {label:"Press the ❓ mystery button", reason:"brave curiosity"}
  ];

  options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.textContent = opt.label;
    btn.onclick = ()=> addHeart(opt.reason);
    choices.appendChild(btn);
  });
}

function spawnHeart(){
  const h = document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*window.innerWidth+"px";
  h.style.bottom="-20px";
  h.style.animationDuration=(6+Math.random()*4)+"s";
  document.getElementById("heartField").appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(spawnHeart,800);

render();
</script>

</body>
</html>
